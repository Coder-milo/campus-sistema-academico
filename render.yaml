services:
  - type: web
    name: campus-sistema-academico
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.1
      - key: DATABASE_URL
        fromDatabase:
          name: campus-academico-db
          property: connectionString
      - key: CAMPUS_BOOTSTRAP
        sync: false
databases:
  - name: campus-academico-db
    plan: free
    region: oregon
    ipAllowList: []
